name: 3-OS Native & Virtual Environment Verification Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  # ===========================================================================
  # 1. LINUX / UNIX + EDGE ARM64 (Ubuntu + QEMU Pi 400 + tc netem Fault Injection)
  # ===========================================================================
  linux-and-edge-arm64:
    name: Linux x86_64 + Pi 400 ARM64 + Fault Injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust, Cross-Compilers, QEMU & iproute2 (tc netem)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git curl iproute2 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user-static
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

      - name: Build clusterd (x86_64 + aarch64 Edge Pi 400) & Run Unit Tests
        working-directory: clusterd
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo test --all-targets
          cargo build --release --target x86_64-unknown-linux-gnu
          cargo build --release --target aarch64-unknown-linux-gnu
          qemu-aarch64-static -L /usr/aarch64-linux-gnu ./target/aarch64-unknown-linux-gnu/release/clusterd probe

      - name: Build stock llama.cpp v1.0.0 (llama-server + rpc-server)
        run: |
          git clone --depth 1 --branch v1.0.0 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp || \
            git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_RPC=ON \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build /tmp/llama.cpp/build --target rpc-server llama-server -j"$(nproc)"

      - name: Spawn 2 Loopback Workers + Master, Verify SSE Streaming & <6s Fault Rebalance
        run: |
          CLUSTERD="./clusterd/target/x86_64-unknown-linux-gnu/release/clusterd"
          RPC_BIN="$(find /tmp/llama.cpp/build -type f -name rpc-server | head -n 1)"

          # Spawn 2 real loopback workers backed by rpc-server -c
          "${CLUSTERD}" worker --host 127.0.0.1 --port 50051 --rpc-bin "${RPC_BIN}" &
          W1_PID=$!
          "${CLUSTERD}" worker --host 127.0.0.1 --port 50052 --rpc-bin "${RPC_BIN}" &
          W2_PID=$!
          sleep 2

          "${CLUSTERD}" verify-handshake 127.0.0.1:50051
          "${CLUSTERD}" verify-handshake 127.0.0.1:50052

          # Start clusterd master on 127.0.0.1:18080
          "${CLUSTERD}" master --host 127.0.0.1 --port 18080 --workers 127.0.0.1:50051,127.0.0.1:50052 &
          MASTER_PID=$!
          sleep 2

          # Verify POST /v1/chat/completions streams real SSE tokens
          SSE_OUT="$(curl -sf -N -X POST http://127.0.0.1:18080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"TinyStories-15M-Q4_K_M.gguf","stream":true,"messages":[{"role":"user","content":"Hello"}]}')"
          echo "${SSE_OUT}"
          echo "${SSE_OUT}" | grep -q "data: \[DONE\]"

          # Inject 3.5% packet loss on loopback if permitted by runner kernel, then kill worker 2
          sudo tc qdisc add dev lo root netem loss 3.5% || true
          kill -9 "${W2_PID}" || true
          sleep 4
          sudo tc qdisc del dev lo root netem || true

          # Verify Master detected worker-2 OFFLINE in <6s and continues streaming with 1 active worker
          HEALTH_JSON="$(curl -sf http://127.0.0.1:18080/health)"
          echo "Post-fault health: ${HEALTH_JSON}"
          echo "${HEALTH_JSON}" | grep -q '"online_workers":1'

          kill "${W1_PID}" "${MASTER_PID}" || true

  # ===========================================================================
  # 2. WINDOWS VIRTUAL ENVIRONMENT (GlobalMemoryStatusEx + Job Object Cleanup)
  # ===========================================================================
  windows-native-vm:
    name: Windows Server VM (FFI RAM + Job Objects)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile clusterd.exe & Run Windows Unit Tests
        working-directory: clusterd
        run: |
          cargo build --release
          cargo test --all-targets

      - name: Verify GlobalMemoryStatusEx Probe & llama-server.exe v1.0.0 CLI Validation
        working-directory: clusterd
        run: |
          .\target\release\clusterd.exe probe
          .\target\release\clusterd.exe master --workers 127.0.0.1:50051,127.0.0.1:50052 --dry-run

  # ===========================================================================
  # 3. ANDROID VIRTUAL ENVIRONMENTS (Old API 29 + New API 35 Emulators)
  # ===========================================================================
  android-multi-gen-emulators:
    name: Android API ${{ matrix.api-level }} Emulator (NDK r28 16KB ELF)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 29, 35 ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 & Rust Android Target
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android NDK r28 & Build 16 KB Aligned librpc_server_exec.so
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.12433566"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/28.0.12433566"
          rustup target add aarch64-linux-android
          chmod +x scripts/build_android_ndk28.sh
          ./scripts/build_android_ndk28.sh
          (cd clusterd && cargo build --release)

      - name: Run Android Robolectric Unit Tests & Mixed-Cluster Verification
        run: |
          gradle :app:testDebugUnitTest
          python3 scripts/verify_mixed_cluster.py

      - name: Build Debug APK
        run: |
          gradle assembleDebug

      - name: Boot Android API ${{ matrix.api-level }} Emulator & Verify App Launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.aistudio.clusterlab.kxmpzq/com.example.MainActivity
            sleep 4
            if adb logcat -d | grep -iE "avc: denied|W\^X|SIGSYS|FATAL EXCEPTION"; then
              echo "Runtime crash or SELinux/W^X violation detected in logcat!"
              exit 1
            fi

