[package]
name = "clusterd"
version = "1.0.0"
edition = "2021"
authors = ["AJ60"]
description = "Cross-platform distributed inference orchestrator and non-root RPC worker supervisor for Windows, Linux, Android, and ARM64 edge devices"
license = "MIT"
keywords = ["cluster", "rpc", "distributed", "llama", "edge"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "clusterd"
path = "src/main.rs"

[lib]
name = "clusterd"
path = "src/lib.rs"
