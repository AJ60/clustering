name: clusterd-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-clusterd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check and test clusterd
        working-directory: clusterd
        run: |
          cargo check
          cargo test
          bash tests/virtual_cluster_test.sh
